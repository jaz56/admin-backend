services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      # 🟢 CORRIGÉ : lié à 127.0.0.1 uniquement — plus jamais exposé directement
      # sur le réseau, contourne le piège UFW+Docker. Accès seulement via
      # tunnel SSH ou depuis la VM elle-même.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      # 🟢 CORRIGÉ : Grafana reste aussi en local — le seul point d'entrée
      # externe est désormais Nginx (HTTPS) sur le port 443
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Nécessaire pour que Grafana génère des liens/redirections corrects
      # derrière un reverse proxy HTTPS
      - GF_SERVER_ROOT_URL=https://192.168.72.10/
      - GF_SERVER_DOMAIN=192.168.72.10

volumes:
  prometheus_data:
  grafana_data: