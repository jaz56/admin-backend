services:
  mongodb:
    image: mongo:latest
    container_name: admin_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=adminUser
      - MONGO_INITDB_ROOT_PASSWORD=08062003

  backend:
    image: yassmine0806/admin-backend:latest
    container_name: admin_backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8083:8083"
    volumes:
      - backend_uploads:/app/uploads
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://adminUser:08062003@mongodb:27017/admin_db?authSource=admin
      - JWT_SECRET=Y2Q4OWI0M2VlZjZkNTk3YjRlZGNhYzc2MjhkYjhmZTU0ZDVhMzE0ZTJiMjc4NmViNDFiYWVjODNiNmEyZWY5YQ==
      - JWT_EXPIRATION=86400000
      - SERVER_PORT=8083
      - FILE_UPLOAD_DIR=/app/uploads
      - APP_BASE_URL=http://localhost:8083
      - APP_FRONTEND_URL=http://localhost:4200
      - CORS_ALLOWED_ORIGINS=http://localhost:4200
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=50MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=50MB
      - MAIL_USERNAME=jazmingabsi@gmail.com
      - MAIL_PASSWORD=nvmdfaoarngjczlo

  frontend:
    image: yassmine0806/admin-frontend:latest
    container_name: admin_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mongodb_data:
  backend_uploads: